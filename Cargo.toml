[package]
name = "spanglings"
version = "0.5.4"
edition = "2021"
authors = ["Daniel Fisher"]
description = "Spanglings builds the syntax compiler; real-world usage supplies the data. Developer-grade CLI & interactive TUI for mastering Spanish."
license = "Apache-2.0"
repository = "https://github.com/dnf0/spanglings"
homepage = "https://github.com/dnf0/spanglings"
readme = "README.md"
keywords = ["spanish", "learning", "cli", "tui", "rustlings"]
categories = ["command-line-utilities", "internationalization"]
include = [
    "src/**/*",
    "exercises/**/*",
    "tests/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
ratatui = { version = "0.29", features = ["all-widgets"] }
crossterm = { version = "0.28", features = ["event-stream"] }
notify = "7.0"
notify-debouncer-mini = "0.5"
unicode-normalization = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
colored = "2.1"
thiserror = "2.0"
anyhow = "1.0"
regex = "1.10"
dirs = "5.0"
include_dir = "0.7"
clap_complete = "4.5"
rand = "0.8"
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[features]
default = []
wasm = ["wasm-bindgen", "serde-wasm-bindgen"]

[dev-dependencies]
tempfile = "3.10"

