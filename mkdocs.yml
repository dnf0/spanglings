site_name: Spanglings
site_description: Spanglings builds the syntax compiler; real-world usage supplies the data. Developer-grade CLI & interactive TUI for mastering Spanish (B1–C1).
site_url: https://dnf0.github.io/spanglings/
site_author: Spanglings Contributors
repo_name: dnf0/spanglings
repo_url: https://github.com/dnf0/spanglings

theme:
  name: material
  palette:
    # Palette toggle for dark mode
    - scheme: slate
      primary: red
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    # Palette toggle for light mode
    - scheme: default
      primary: red
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Interactive Playground: playground.md
  - Onboarding Guide: onboarding-guide.md
  - Curriculum Syllabus: syllabus.md
  - CLI & TUI Reference: cli-reference.md
  - Grammar Cheat Sheets: grammar-reference.md
  - Contributing: contributing.md

extra_css:
  - assets/playground/playground.css

not_in_nav: |
  superpowers/**
  adr/**
  BACKLOG.md
